name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CI: 'true'
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npx next typegen && npm run typecheck
      - name: Unit + contract tests
        run: npm test
      - name: 21/21 test vectors (TypeScript engine vs spec)
        run: npm run test:vectors
      - name: Drive artifacts match the manifest checksums
        run: npm run drive:verify
      - name: Build
        run: npm run build
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
      - name: E2E (validation flow, a11y, mobile)
        run: npm run test:e2e
      - name: Lighthouse CI (mobile, indexing enabled only for this audit)
        run: npm run lighthouse:ci
        env:
          NEXT_PUBLIC_INDEXING_ENABLED: 'true'
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          retention-days: 7
