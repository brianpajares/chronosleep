function renderStep(){
 const q=I[lang].questions[step]; $("#qtitle").textContent=q[0];$("#qhelp").textContent=q[1];$("#progtxt").textContent=t("progress").replace("{n}",step+1);$("#progbar").style.width=((step+1)/8*100)+"%";$("#back").textContent=t("back");$("#next").textContent=step===7?t("see"):t("next");$("#err").textContent="";
 const f=fields[step],c=$("#control");c.innerHTML="";
 if(step<4){c.innerHTML=`<input class="control" id="inp" type="time" value="${data[f]||""}" aria-label="${q[0]}">`}
 else if(step===4){c.innerHTML=`<div class="presets">${[0,10,15,30].map(v=>`<button class="chip ${data[f]===v?"selected":""}" data-v="${v}">${v} min</button>`).join("")}</div><input class="control" id="inp" type="number" min="0" max="120" step="1" value="${data[f]}">`;c.querySelectorAll(".chip").forEach(b=>b.onclick=()=>{data[f]=+b.dataset.v;renderStep()})}
 else if(step===5){c.innerHTML=`<input class="control" id="inp" type="number" min="1" max="6" step="1" value="${data[f]}">`}
 else if(step===6){c.innerHTML=`<div class="choice"><button class="chip ${data[f]===true?"selected":""}" data-v="true">${lang==="pt"?"Sim":lang==="en"?"Yes":"Sí"}</button><button class="chip ${data[f]===false?"selected":""}" data-v="false">${lang==="pt"?"Não":lang==="en"?"No":"No"}</button></div>`;c.querySelectorAll(".chip").forEach(b=>b.onclick=()=>{data[f]=b.dataset.v==="true";renderStep()})}
 else{c.innerHTML=`<input class="control" id="range" type="range" min="0" max="120" step="1" value="${data[f]}" aria-label="${q[0]}"><input class="control" style="margin-top:12px" id="inp" type="number" min="0" max="120" step="1" value="${data[f]}"><div class="rowlabel"><span>0</span><span>30</span><span>60</span><span>90</span><span>120 min</span></div>`;$("#range").oninput=e=>{$("#inp").value=e.target.value;data[f]=+e.target.value}}
 const inp=$("#inp");if(inp)inp.oninput=e=>{data[f]=step<4?e.target.value:+e.target.value;if(step===7)$("#range").value=e.target.value}
}
$("#back").onclick=()=>{if(step===0)show("landing");else{step--;renderStep()}};
$("#next").onclick=()=>{
 const f=fields[step],v=data[f];let err="";
 if(step<4&&!/^(?:[01]\d|2[0-3]):[0-5]\d$/.test(v||""))err=t("err_time");
 if(step===4&&(!Number.isInteger(v)||v<0||v>120))err=t("err_integer");
 if(step===5&&(!Number.isInteger(v)||v<1||v>6))err=t("err_integer");
 if(step===7&&(!Number.isInteger(v)||v<0||v>120))err=t("err_integer");
 if(!err&&step>=3){try{const z=calc(data);if(z.sdW<180||z.sdW>840||z.sdF<180||z.sdF>840)err=t("err_sleep")}catch(e){err=t("err_sleep")}}
 if(err){$("#err").textContent=err;return}
 if(step<7){step++;renderStep()}else{show("processing");setTimeout(()=>{result=calc(data);show("preview");renderResult()},360)}
};
function minutes(s){const [h,m]=s.split(":").map(Number);return h*60+m}
function mod(n,m){return ((n%m)+m)%m}
function wrap720(x){return mod(x+720,1440)-720}
function hm(x){x=Math.round(mod(x,1440));return String(Math.floor(x/60)).padStart(2,"0")+":"+String(x%60).padStart(2,"0")}
function human(h){let m=Math.round(h*60);return `${Math.floor(m/60)} h ${String(m%60).padStart(2,"0")} min`}
function calc(x){
 const wb=minutes(x.work_bedtime),ww=minutes(x.work_wake_time),fb=minutes(x.free_bedtime),fw=minutes(x.free_wake_time),lat=x.sleep_latency_min;
 const soW=mod(wb+lat,1440),soF=mod(fb+lat,1440),sdW=mod(ww-soW,1440),sdF=mod(fw-soF,1440);
 if(sdW<180||sdW>840||sdF<180||sdF>840)throw Error("duration");
 const msw=mod(soW+sdW/2,1440),msf=mod(soF+sdF/2,1440),rel=wrap720(msf-msw),sjl=Math.abs(rel),dir=rel===0?0:Math.sign(rel);
 const wshift=dir*Math.min(sjl,x.wake_flexibility_min),rem=Math.max(0,sjl-Math.abs(wshift)),fshift=-dir*Math.min(rem,90),planned=Math.abs(wrap720((msf+fshift)-(msw+wshift)));
 const sched=[];for(let d=1;d<=7;d++){let work=d<=x.workdays_per_week,shift=work?wshift:fshift,b=work?wb:fb,w=work?ww:fw,sd=work?sdW:sdF;sched.push({day:d,type:work?"work":"free",bed:hm(b+shift),wake:hm(w+shift),dur:sd/60})}
 return {sdW,sdF,msw,msf,rel,sjl:sjl/60,wshift,fshift,planned:planned/60,low:Math.max(0,(sjl-30)/60),high:Math.min(12,(sjl+30)/60),sched};
}
function renderResult(){
 const r=result;$("#sjlvalue").textContent=human(r.sjl);const d=r.rel>0?t("later"):r.rel<0?t("earlier"):t("same");$("#direction").textContent=d;$("#wmid").textContent=hm(r.msw);$("#fmid").textContent=hm(r.msf);$("#wdot").style.left=(r.msw/1440*100)+"%";$("#fdot").style.left=(r.msf/1440*100)+"%";$("#worklabel").textContent=t("work");$("#freelabel").textContent=t("free");$("#sensvalue").textContent=`${human(r.low)} – ${human(r.high)}`;$("#teaserday").textContent=`1 · ${t("work")}: ${r.sched[0].bed} → ${r.sched[0].wake}`;$("#reportSjl").textContent=human(r.sjl);$("#reportDir").textContent=d;$("#schedule").innerHTML=r.sched.map(d=>`<tr><td>${d.day}</td><td>${t(d.type)}</td><td>${d.bed}</td><td>${d.wake}</td><td>${d.dur.toFixed(2)} h</td></tr>`).join("");
}
$("#togate").onclick=()=>show("gate");
$("#submitreport").onclick=()=>{const email=$("#email").value.trim();if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email)||!$("#delivery").checked){$("#gateerr").textContent=t("err_email");return}$("#gateerr").textContent="";show("success")};
$("#viewreport").onclick=()=>{show("report");renderResult()};
applyLang();
</script>
</body>
</html>
